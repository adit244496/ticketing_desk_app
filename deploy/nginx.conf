# Hospi Ticketing Desk - nginx reverse proxy
# Serves the built frontend (frontend/dist) and proxies API + uploads to the
# gunicorn backend on 127.0.0.1:8000.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ticketing
#   sudo ln -s /etc/nginx/sites-available/ticketing /etc/nginx/sites-enabled/ticketing
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name supportdesk.neotiahospitality.com;                       # replace with your domain if you have one

    root /media/DataDisk/app/ticketing/frontend/dist;
    index index.html;

    # SPA routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files -> gunicorn (served by the Flask /uploads/<file> route)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    client_max_body_size 25m;            # allow image/file uploads
}
